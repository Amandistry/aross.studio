
server {
    listen 8000;
    server_name aross.studio;

    root /usr/share/nginx/html/root;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

server {
    listen 8000;
    server_name www.aross.studio;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://aross.studio$request_uri;
    }
}

server {
    listen 8000 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
